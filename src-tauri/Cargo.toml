[package]
name = "antiphon"
version = "0.1.0"
description = "Antiphon - Git-native masaüstü API client"
authors = ["Antiphon"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` soneki gereksiz görünür ama lib adını benzersiz kılıp bin adıyla
# çakışmasını önler (yalnız Windows'ta sorun; rust-lang/cargo#8519).
name = "antiphon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
# Gözlemlenebilirlik: JS ve Rust log'ları tek DÖNEN dosyaya (app log dizini) yazılır.
# Yerel-önce uygulamada uzak telemetri YOK; çöküş teşhisinin tek kaynağı bu dosyadır.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP istek motoru: got yerine reqwest (rustls). TLS/yönlendirme/timeout kontrolü
# bizde; istekler webview CSP'sini DEĞİL bu Rust komutunu geçer (connect-src 'self').
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "gzip",
  "brotli",
  "deflate",
  "stream",
  "cookies",
] }
# Sayılabilir (listelenebilir) çerez kavanozu — reqwest'in opak Jar'ı enumerate edilemez.
reqwest_cookie_store = "0.8"
base64 = "0.22"
# Realtime (Faz 7): WebSocket (tokio-tungstenite), SSE (reqwest stream), GraphQL-sub.
# Faz 9: MCP stdio (process, io-util, time) + mock server (axum).
tokio = { version = "1", features = [
  "macros",
  "sync",
  "rt",
  "process",
  "io-util",
  "time",
] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Mock server (fastify yerine): OpenAPI yollarını yerel dinleyen HTTP ile taklit eder.
axum = "0.7"
# Atomik yazma geçici dosya adı + slug fallback (çakışmasız).
uuid = { version = "1", features = ["v4"] }
# Secret vault: değerler OS anahtar zincirinde (macOS Keychain / Windows Credential Manager /
# Linux Secret Service via zbus — saf Rust, sistem libdbus gerekmez). Enumerate edilemediğinden
# anahtar isimleri ayrı index dosyasında tutulur.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
# Çalışma alanı dosya izleyici (chokidar yerine): dış değişikliklerde ağaç tazelenir.
notify = "6"
# Git (isomorphic-git yerine): status/stage/commit/log/diff/pull/push. libgit2 gömülü
# derlenir (vendored) — sistem libgit2'ye bağımlılık yok.
git2 = "0.20"
# Birleşik (unified) diff üretimi (diff.js createTwoFilesPatch yerine).
similar = "2"
# Script sandbox (Faz 8b): kullanıcı pre-request/test script'leri (node:vm yerine).
# QuickJS gömülü; kullanıcı JS'i tam izole — host/Tauri erişimi YOK (yalnız pm.* köprüsü).
rquickjs = "0.6"

# Masaüstüne özgü: yeniden başlatma (process). Otomatik güncelleme (updater) sonraki
# fazda imza anahtarı + CI ile eklenecek.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
